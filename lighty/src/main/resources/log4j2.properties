# Log4j2 configuration with environment variable support
# Syntax: ${env:VAR:-default}
#
# Environment variables:
#   LOG_ROOT_LEVEL  — root log level (default: INFO)
#   LOG_DD_LEVEL    — device-discovery log level (default: DEBUG)
#   LOG_SB_LEVEL    — sb-restconf-client log level (default: DEBUG)
#   LOG_TPCE_LEVEL  — general transportpce log level (default: INFO)
#   LOG_LIGHTY_LEVEL — lighty.io log level (default: INFO)
#   LOG_MDSAL_LEVEL — MDSAL log level (default: INFO)

rootLogger.level = ${env:LOG_ROOT_LEVEL:-INFO}
rootLogger.appenderRef.stdout.ref = STDOUT

appender.stdout.type = Console
appender.stdout.name = STDOUT
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = %5p [%t] (%F:%L) - %m%n

# Per-namespace log levels
logger.devicediscovery.name = org.opendaylight.transportpce.devicediscovery
logger.devicediscovery.level = ${env:LOG_DD_LEVEL:-DEBUG}

logger.sbrestconf.name = org.opendaylight.transportpce.sbrestconf
logger.sbrestconf.level = ${env:LOG_SB_LEVEL:-DEBUG}

logger.networkmodel.name = org.opendaylight.transportpce.networkmodel
logger.networkmodel.level = ${env:LOG_NM_LEVEL:-INFO}

logger.common.name = org.opendaylight.transportpce.common
logger.common.level = ${env:LOG_COMMON_LEVEL:-INFO}

logger.pce.name = org.opendaylight.transportpce.pce
logger.pce.level = ${env:LOG_PCE_LEVEL:-INFO}

logger.servicehandler.name = org.opendaylight.transportpce.servicehandler
logger.servicehandler.level = ${env:LOG_SH_LEVEL:-INFO}

logger.tapi.name = org.opendaylight.transportpce.tapi
logger.tapi.level = ${env:LOG_TAPI_LEVEL:-INFO}

logger.lighty.name = io.lighty
logger.lighty.level = ${env:LOG_LIGHTY_LEVEL:-INFO}

logger.mdsal.name = org.opendaylight.mdsal
logger.mdsal.level = ${env:LOG_MDSAL_LEVEL:-INFO}

logger.yangtools.name = org.opendaylight.yangtools
logger.yangtools.level = ${env:LOG_YANGTOOLS_LEVEL:-WARN}
