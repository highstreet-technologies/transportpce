openapi: 3.0.3
info:
  title: TransportPCE Optical API
  description: |
    Fork-specific northbound REST API for optical network data served by
    TransportPCE on the same Jetty instance as RESTCONF. Designed for UI
    applications (odlux-nx networkViewApp integration).

    All GET endpoints return RFC7951 JSON - the same wire format as
    /restconf/data/... - with YANG node names in kebab-case and namespace
    prefixes for augmentations. Each list entry is a bare RFC7951 object;
    list endpoints wrap entries in a JSON array.
  version: 1.0.0
  license:
    name: Eclipse Public License 1.0
    url: https://www.eclipse.org/legal/epl-v10.html
servers:
  - url: http://localhost:8181/optical-api
paths:
  /nodes:
    get:
      summary: All port-mapping nodes
      description: |
        Returns every node stored in the port-mapping datastore
        (transportpce-portmapping:network/nodes), each as a bare RFC7951
        entry object wrapped in a JSON array.
      operationId: getNodes
      responses:
        '200':
          description: Node list (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortMappingNode'
  /nodes/{nodeId}:
    get:
      summary: Single port-mapping node
      description: |
        Returns one node from the port-mapping datastore as a bare RFC7951
        entry object (including its port mappings).
      operationId: getNode
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: The port-mapping node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortMappingNode'
        '404':
          $ref: '#/components/responses/NotFound'
  /nodes/{nodeId}/ports:
    get:
      summary: Port mappings of a node
      description: |
        Returns the port mappings (logical-connection-point / supporting
        port / rate etc.) of one node, each as a bare RFC7951 entry object
        wrapped in a JSON array.
      operationId: getPorts
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Port mapping list (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortMapping'
  /links/uuids={uuids}:
    get:
      summary: Links by device-discovery UUID
      description: |
        Returns network topology links (ietf-network-topology, network
        'openroadm-topology') carrying the given device-discovery UUID
        augmentation, each as a bare RFC7951 entry object wrapped in a
        JSON array. Links without the augmentation are skipped.
      operationId: getLinksByUuids
      parameters:
        - name: uuids
          in: path
          required: true
          description: Comma-separated list of device-discovery UUIDs
          schema:
            type: string
          example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
      responses:
        '200':
          description: Matching links (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkLink'
  /read-link-list:
    post:
      summary: Filtered, paginated link query (odlux dataprovider format)
      description: |
        Returns links in the odlux dataprovider envelope
        (data-provider:output with data and pagination). The link entries
        inside data are in RFC7951 format - the same wire format as the GET
        endpoints and /restconf/data.
      operationId: readLinkList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataproviderInput'
      responses:
        '200':
          description: Link page in dataprovider envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataproviderOutputLinks'
  /read-service-list:
    post:
      summary: Filtered, paginated service query (odlux dataprovider format)
      description: |
        Returns OpenROADM service list entries (operational datastore) in
        the odlux dataprovider envelope. The service entries inside data
        are in RFC7951 format - the same wire format as /restconf/data.
      operationId: readServiceList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataproviderInput'
      responses:
        '200':
          description: Service page in dataprovider envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataproviderOutputServices'
  /rests/operations/org-openroadm-service:service-create:
    post:
      summary: OpenROADM service-create RPC
      description: |
        Creates an optical service. This RPC is implemented by the
        transportpce servicehandler (invoked via RESTCONF operations);
        it is documented here for the odlux-nx clients. Request and
        response are RFC7951 JSON under an "input" wrapper.
      operationId: serviceCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreateRequest'
      responses:
        '200':
          description: RPC result with configuration response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcServiceResponse'
        '500':
          description: RPC failed (validation, path computation, rendering)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcServiceResponse'
  /rests/operations/org-openroadm-service:service-delete:
    post:
      summary: OpenROADM service-delete RPC
      description: |
        Deletes an optical service. This RPC is implemented by the
        transportpce servicehandler (invoked via RESTCONF operations);
        it is documented here for the odlux-nx clients. Request and
        response are RFC7951 JSON under an "input" wrapper.
      operationId: serviceDelete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceDeleteRequest'
      responses:
        '200':
          description: RPC result with configuration response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcServiceResponse'
        '500':
          description: RPC failed (service not found, rendering error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcServiceResponse'
components:
  parameters:
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Port-mapping node identifier (node-id)
      schema:
        type: string
      example: XPDR-UlmMuen
  responses:
    NotFound:
      description: No port-mapping node with this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      example:
        message: No port-mapping node with id 'XPDR-UlmMuen'
    PortMappingNode:
      type: object
      description: RFC7951 entry of transportpce-portmapping:network/nodes
      required:
        - node-id
      properties:
        node-id:
          type: string
          description: Unique identifier for the node in the network
        datamodel-type:
          type: string
          description: Data model used to control this node
          enum:
            - OPENROADM
            - OPENCONFIG
        node-info:
          $ref: '#/components/schemas/NodeInfo'
        mapping:
          type: array
          description: Logical-to-physical port mapping list
          items:
            $ref: '#/components/schemas/PortMapping'
        mc-capabilities:
          type: array
          items:
            $ref: '#/components/schemas/McCapability'
        shared-risk-group:
          type: array
          items:
            $ref: '#/components/schemas/Srg'
        switching-pool-lcp:
          type: array
          items:
            type: string
        cp-to-degree:
          type: array
          items:
            $ref: '#/components/schemas/CpToDegree'
    NodeInfo:
      type: object
      description: transportpce-portmapping node-info container
      properties:
        node-type:
          type: string
          description: OpenROADM node type
          enum:
            - rdm
            - xpdr
            - ila
            - extplug
        openroadm-version:
          type: string
          description: OpenROADM version
          enum:
            - '1.2.1'
            - '2.2.1'
            - '7.1'
        openconfig-version:
          type: string
        sw-version:
          type: string
        node-clli:
          type: string
        node-vendor:
          type: string
        node-model:
          type: string
        node-ip-address:
          type: string
        node-instance:
          type: integer
    PortMapping:
      type: object
      description: RFC7951 entry of transportpce-portmapping mapping list
      required:
        - logical-connection-point
      properties:
        logical-connection-point:
          type: string
          description: Logical connection point name (e.g. XPDR1-CLIENT1)
        supporting-circuit-pack-name:
          type: string
        supporting-port:
          type: string
        supporting-oms:
          type: string
        supporting-ots:
          type: string
        port-direction:
          type: string
          description: Port direction (e.g. bidirectional, tx, rx)
        port-qual:
          type: string
          description: Port qualification (e.g. client, network)
        port-admin-state:
          type: string
        port-oper-state:
          type: string
        supporting-ethernet:
          type: string
        supporting-otu4:
          type: string
        supporting-otucn:
          type: string
        supporting-odu4:
          type: string
        supporting-oducn:
          type: string
        rate:
          type: string
          description: Rate supported by the port
        supported-interface-capability:
          type: array
          description: Supported interface capabilities (identityrefs)
          items:
            type: string
        supported-operational-mode:
          type: array
          items:
            type: string
        xpdr-type:
          type: string
          description: Transponder type when node-type is xpdr
        connection-map-lcp:
          type: string
        partner-lcp:
          type: string
    McCapability:
      type: object
      description: Media-channel capability of a node (keyed by mc-node-name)
      required:
        - mc-node-name
      properties:
        mc-node-name:
          type: string
        slot-width-granularity:
          type: string
        min-slots:
          type: integer
        max-slots:
          type: integer
        center-freq-granularity:
          type: string
        available-frequency:
          type: array
          items:
            type: string
        available-slot-count:
          type: integer
    Srg:
      type: object
      description: Shared risk group (keyed by srg-number)
      required:
        - srg-number
      properties:
        srg-number:
          type: integer
        srg-name:
          type: string
        srg-clli:
          type: string
    CpToDegree:
      type: object
      description: Circuit-pack to degree association
      required:
        - circuit-pack-name
      properties:
        circuit-pack-name:
          type: string
        degree-number:
          type: integer
        interface-name:
          type: string
    NetworkLink:
      type: object
      description: |
        RFC7951 entry of an ietf-network-topology link of network
        'openroadm-topology', including the device-discovery uuid
        augmentation.
      required:
        - link-id
      properties:
        link-id:
          type: string
          description: Link identifier
        source:
          type: object
          properties:
            source-node:
              type: string
            source-tp:
              type: string
        destination:
          type: object
          properties:
            dest-node:
              type: string
            dest-tp:
              type: string
        device-discovery:uuid:
          type: string
          description: Autogenerated unique identifier over all items inside the network
    DataproviderInput:
      type: object
      description: odlux dataprovider request envelope
      required:
        - data-provider:input
      properties:
        data-provider:input:
          type: object
          properties:
            filter:
              type: array
              items:
                $ref: '#/components/schemas/DataproviderFilter'
            sortorder:
              type: array
              items:
                $ref: '#/components/schemas/DataproviderSortOrder'
            pagination:
              $ref: '#/components/schemas/DataproviderPaginationIn'
    DataproviderFilter:
      type: object
      properties:
        property:
          type: string
          description: |
            Filter property name. Supported link properties:
            link-id, device-discovery:uuid, source.source-node, source.source-tp,
            destination.dest-node, destination.dest-tp,
            org-openroadm-common-network:link-type,
            org-openroadm-common-network:operational-state,
            org-openroadm-common-network:administrative-state,
            org-openroadm-common-network:opposite-link.
            Values may contain * and ? wildcards (regex matching).
        filtervalue:
          type: string
          description: Single filter value (wildcards allowed)
        filtervalues:
          type: array
          description: Multiple filter values — matches if one of them hits
          items:
            type: string
    DataproviderSortOrder:
      type: object
      properties:
        property:
          type: string
          description: |
            Sort property name. Same properties as the filter:
            link-id, device-discovery:uuid, source.source-node, source.source-tp,
            destination.dest-node, destination.dest-tp,
            org-openroadm-common-network:link-type,
            org-openroadm-common-network:operational-state,
            org-openroadm-common-network:administrative-state,
            org-openroadm-common-network:opposite-link.
            Null/missing values sort last; unknown properties are ignored.
        sortorder:
          type: string
          description: Sort direction
          enum:
            - ascending
            - descending
    DataproviderPaginationIn:
      type: object
      properties:
        page:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
    DataproviderOutputLinks:
      type: object
      description: odlux dataprovider response envelope for links
      required:
        - data-provider:output
      properties:
        data-provider:output:
          type: object
          properties:
            data:
              type: array
              description: Link entries in RFC7951 format (same as GET endpoints)
              items:
                $ref: '#/components/schemas/NetworkLink'
            pagination:
              $ref: '#/components/schemas/DataproviderPaginationOut'
    DataproviderPaginationOut:
      type: object
      properties:
        page:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    Service:
      type: object
      description: |
        RFC7951 entry of org-openroadm-service service-list services.
      required:
        - service-name
      properties:
        service-name:
          type: string
        common-id:
          type: string
        connection-type:
          type: string
          enum:
            - service
            - infrastructure
            - roadm-line
            - optical-tunnel
        lifecycle-state:
          type: string
          description: Service lifecycle state
          enum:
            - deployed
            - planned
            - maintenance
            - deploying
            - undeploying
            - undeployed
            - proposed
            - draft
            - deploy-failed
            - undeploy-failed
            - deployed-augmented
            - deployed-updating
        administrative-state:
          type: string
          enum:
            - inService
            - outOfService
            - maintenance
        operational-state:
          type: string
          enum:
            - inService
            - outOfService
            - degraded
        service-a-end:
          $ref: '#/components/schemas/ServiceEndpoint'
        service-z-end:
          $ref: '#/components/schemas/ServiceEndpoint'
    ServiceEndpoint:
      type: object
      description: Service endpoint (service-a-end / service-z-end)
      properties:
        node-id:
          type: string
        clli:
          type: string
        service-format:
          type: string
        service-rate:
          type: integer
          format: int32
    DataproviderOutputServices:
      type: object
      description: odlux dataprovider response envelope for services
      required:
        - data-provider:output
      properties:
        data-provider:output:
          type: object
          properties:
            data:
              type: array
              description: Service entries in RFC7951 format
              items:
                $ref: '#/components/schemas/Service'
            pagination:
              $ref: '#/components/schemas/DataproviderPaginationOut'
    SdncRequestHeader:
      type: object
      description: SDNC request header of an OpenROADM RPC (mandatory)
      required:
        - request-id
        - rpc-action
      properties:
        request-id:
          type: string
          description: Unique request identifier (UUID recommended)
        rpc-action:
          type: string
          description: Must match the invoked RPC
          enum:
            - service-create
            - service-delete
            - service-reroute
            - service-reconfigure
            - service-feasibility-check
            - temp-service-create
            - temp-service-delete
            - equipment-notification
            - service-restoration
            - service-roll
            - service-revert
            - service-restart
        request-system-id:
          type: string
          description: Originating system/app name
        notification-url:
          type: string
          description: Callback URL for asynchronous result notifications
        opt-locks:
          type: string
    ServicePort:
      type: object
      description: Physical port of a service endpoint direction
      properties:
        port-device-name:
          type: string
        port-circuit-pack-name:
          type: string
        port-type:
          type: string
        port-name:
          type: string
        port-rack:
          type: string
        port-shelf:
          type: string
        port-slot:
          type: string
        port-sub-slot:
          type: string
    ServiceLgx:
      type: object
      description: LGX (cross-connect panel) of a service endpoint direction
      properties:
        lgx-device-name:
          type: string
        lgx-port-name:
          type: string
        lgx-port-rack:
          type: string
        lgx-port-shelf:
          type: string
    ServiceDirection:
      type: object
      description: One direction (tx or rx) of a service endpoint
      required:
        - index
      properties:
        index:
          type: integer
          format: int32
        port:
          $ref: '#/components/schemas/ServicePort'
        lgx:
          $ref: '#/components/schemas/ServiceLgx'
    ServiceCreateEndpoint:
      type: object
      description: service-a-end / service-z-end of a service-create request
      required:
        - service-rate
        - service-format
        - clli
        - tx-direction
        - rx-direction
      properties:
        service-rate:
          oneOf:
            - type: integer
              format: int32
            - type: string
              description: Numeric string representation of the rate
          description: Service rate in Gbps (> 0)
        node-id:
          type: string
          description: Node id of the service end
        service-format:
          type: string
          description: Requested service format (wire names)
          enum:
            - Ethernet
            - OTU
            - OC
            - STM
            - OMS
            - ODU
            - OTM
            - other
        clli:
          type: string
          description: CLLI code of the node site
        tx-direction:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ServiceDirection'
        rx-direction:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ServiceDirection'
        optic-type:
          type: string
          description: Optic type of the service end
          enum:
            - gray
            - dwdm
    ServiceCreateRequest:
      type: object
      description: |
        Request envelope of the service-create RPC. Mirrors the payload
        accepted by /rests/operations/org-openroadm-service:service-create.
      required:
        - input
      properties:
        input:
          type: object
          required:
            - sdnc-request-header
            - service-name
            - connection-type
            - service-a-end
            - service-z-end
          properties:
            sdnc-request-header:
              $ref: '#/components/schemas/SdncRequestHeader'
            service-name:
              type: string
              description: Unique service name
            common-id:
              type: string
              description: Optional routing policy / order id
            connection-type:
              type: string
              enum:
                - service
                - infrastructure
                - roadm-line
                - optical-tunnel
            service-a-end:
              $ref: '#/components/schemas/ServiceCreateEndpoint'
            service-z-end:
              $ref: '#/components/schemas/ServiceCreateEndpoint'
            due-date:
              type: string
              description: Due date (date-and-time, RFC 6991)
            operator-contact:
              type: string
    ServiceDeleteRequest:
      type: object
      description: |
        Request envelope of the service-delete RPC. Mirrors the payload
        accepted by /rests/operations/org-openroadm-service:service-delete.
      required:
        - input
      properties:
        input:
          type: object
          required:
            - sdnc-request-header
            - service-delete-req-info
          properties:
            sdnc-request-header:
              $ref: '#/components/schemas/SdncRequestHeader'
            service-delete-req-info:
              type: object
              required:
                - service-name
                - tail-retention
              properties:
                service-name:
                  type: string
                  description: Name of the service to delete
                tail-retention:
                  type: string
                  description: Whether to keep the tail/termination
                  enum:
                    - 'yes'
                    - 'no'
                due-date:
                  type: string
                  description: Optional due date (date-and-time, RFC 6991)
    RpcServiceResponse:
      type: object
      description: |
        Response of the service-create / service-delete RPCs
        (org-openroadm-service output, RFC7951). The response wrapper
        appears as plain "output" (RPCs of the module itself carry no
        namespace prefix).
      properties:
        output:
          type: object
          required:
            - configuration-response-common
          properties:
            configuration-response-common:
              type: object
              properties:
                request-id:
                  type: string
                  description: Echo of the request id
                response-code:
                  type: string
                  description: HTTP-like response code of the RPC (e.g. 200, 404, 500)
                response-message:
                  type: string
                  description: Human readable result message (e.g. "Service create in progress")
                ack-final-indicator:
                  type: string
                  description: Acknowledgement indicator, e.g. Success, Error, Waiting, Failure
