version: '3'
services:
    transportpce:
        image: odl/vanilla-transportpce
        container_name: transportpce
        environment:
            - REMOTE_SDNRURL=${REMOTE_SDNR_URL}
            - REMOTE_WSURL=${REMOTE_SDNR_WSURL}
            - REMOTE_ODL_USERNAME=${SDNR_USERNAME}
            - REMOTE_ODL_PASSWORD=${SDNR_PASSWORD}
            - REMOTE_ODL_ENABLED=${REMOTE_ODL_ENABLED}
            - REMOTE_ODL_TRUSTALL=${TRUSTALL}
            - TRANSPORTPCE_SIMULATOR_MODE=true
        volumes:
            - ./conf/org.ops4j.pax.logging.cfg:/opt/opendaylight/etc/org.ops4j.pax.logging.cfg
            - ./conf/org.opendaylight.transportpce.cfg:/opt/opendaylight/etc/org.opendaylight.transportpce.cfg
            - ./conf/org.opendaylight.transportpce.pce.cfg:/opt/opendaylight/etc/org.opendaylight.transportpce.pce.cfg
        ports:
            - 18181:8181
    gnpy:
        #        image: telecominfraproject/oopt-gnpy:???
        image: odl/gnpy4tpce
        volumes:
            - ./gnpy:/shared
        depends_on:
            - transportpce
    roadma:
        image: ${NTSIM_ROADM_STANDALONE_IMAGE}
        container_name: roadma
        environment:
            - NTS_IP=192.168.178.27
            - EXTERNAL_NTS_IP=192.168.178.27
            - NETCONF_BASE=${SIMPORT}
            - SCRIPTS_DIR=/opt/dev/scripts
            - K8S_DEPLOYMENT=false
            - IPv6Enabled=false
        volumes:
            - ./conf/ntsim_configuration.json:/opt/dev/scripts/configuration.json
            - ./conf/oper-ROADMA.xml:/opt/dev/scripts/startup-load.xml
        #    depends_on: 
        #      - sdnr
        ports:
            - 50010:${SIMPORT}
