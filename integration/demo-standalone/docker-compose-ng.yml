      - NTS_NF_STANDALONE_START_FEATURES="datastore-populate"
      - NTS_NF_MOUNT_POINT_ADDRESSING_METHOD=host-mapping # mapping types: host-mapping, docker-mapping
      - NTS_HOST_IP=${NTS_HOST_IP}
      - HOSTNAME=roadma
      - IPv6_ENABLED=false
      - SSH_CONNECTIONS=1
      - TLS_CONNECTIONS=0
      - NTS_HOST_NETCONF_SSH_BASE_PORT=${SIMPORT}
      - NTS_HOST_NETCONF_TLS_BASE_PORT=65500
    volumes: 
      - ./conf/ntsng.config.json:/opt/dev/ntsim-ng/config/config.json
      - ./conf/oper-ROADMB-operational.xml:/opt/dev/deploy/data/org-openroadm-device-operational.xml
      # - ./conf/oper-ROADMB-pm-operational.xml:/opt/dev/deploy/data/org-openroadm-pm-operational.xml
      # - ./conf/oper-ROADMB-syslog-operational.xml:/opt/dev/deploy/data/org-openroadm-syslog-operational.xml
      - ./conf/oper-ROADMB-running.xml:/opt/dev/deploy/data/org-openroadm-device-running.xml
      # - ./conf/oper-ROADMB-pm-running.xml:/opt/dev/deploy/data/org-openroadm-pm-running.xml
      # - ./conf/oper-ROADMB-syslog-running.xml:/opt/dev/deploy/data/org-openroadm-syslog-running.xml
    ports: 
      - 50011:${SIMPORT}

  roadmc:
    image: ${NTSNG_IMAGE}
