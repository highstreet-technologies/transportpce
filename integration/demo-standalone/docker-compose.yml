services:
    transportpce:
        image: ${TRANSPORT_PCE_IMAGE}
        container_name: transportpce
        environment:
        - REMOTE_SDNRURL=${REMOTE_SDNR_URL}
        - REMOTE_WSURL=${REMOTE_SDNR_WSURL}
        - REMOTE_ODL_USERNAME=${SDNR_USERNAME}
        - REMOTE_ODL_PASSWORD=${SDNR_PASSWORD}
        - REMOTE_ODL_ENABLED=${REMOTE_ODL_ENABLED}
        - REMOTE_ODL_TRUSTALL=${TRUSTALL}
        - TRANSPORTPCE_SIMULATOR_MODE=true
        - LOG_DD_LEVEL=DEBUG
        - LOG_SB_LEVEL=DEBUG
        - LOG_NM_LEVEL=DEBUG
        - TRANSPORTPCE_TIMEOUT_DATASTORE_READ=10000
        - TRANSPORTPCE_TIMEOUT_DATASTORE_WRITE=30000
        - TRANSPORTPCE_TIMEOUT_DATASTORE_DELETEm li=10000
        volumes:
        - ./conf_v7.1/org.ops4j.pax.logging.cfg:/opt/transportpce/etc/org.ops4j.pax.logging.cfg
        - ./conf_v7.1/org.opendaylight.transportpce.cfg:/opt/transportpce/etc/org.opendaylight.transportpce.cfg
        ports:
        - 18181:8181
        healthcheck:
          test: [ "CMD", "curl", "-f", "http://localhost:8181/ready" ]
          interval: 10s
          timeout: 5s
          retries: 3
        networks:
        - oam-network
        - smo-network
    ROADM-Berlin:
        image: ${PYNTS_IMAGE}
        container_name: ROADM-Berlin
        hostname: ROADM-Berlin
        environment:
            NETCONF_USERNAME: ${SIM_NETCONF_USERNAME}
            NETCONF_PASSWORD: ${SIM_NETCONF_PASSWORD}
            SDNR_RESTCONF_URL: ${REMOTE_SDNR_URL}
            SDNR_USERNAME: ${SDNR_USERNAME}
            SDNR_PASSWORD: ${SDNR_PASSWORD}
        volumes:
        - ./conf-generated/ROADM-Berlin-operational.xml:/data/org-openroadm-device-operational.xml
        - ./conf-generated/ROADM-Berlin-running.xml:/data/org-openroadm-device-running.xml
        command: /bin/sh -c "until wget --no-check-certificate -q -O /dev/null ${REMOTE_SDNR_URL}/ready
            2>/dev/null; do echo 'Waiting for sdnr...'; sleep 5; done; echo 'sdnr
            is ready'; exec /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf"
        networks:
        - oam-network
networks:
    oam-network:
        external: 'true'
    smo-network:
      external: 'true'
