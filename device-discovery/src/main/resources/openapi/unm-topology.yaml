---
openapi: "3.0.3"
info:
  version: "2025-10-16"
  title: "Controller modules of RESTCONF"
servers:
  - url: "http://localhost/"
paths:
  /rests/data/ietf-network:networks/network={network-id}/node={node-id}:
    get:
      deprecated: false
      tags:
        - "controller ietf-network"
      parameters:
        - name: "network-id"
          description: "Identifies a network."
          schema:
            type: "string"
          in: "path"
          required: true
        - name: "node-id"
          description: "Uniquely identifies a node within the containing\nnetwork."
          schema:
            type: "string"
          in: "path"
          required: true
        - required: false
          in: "query"
          name: "content"
          schema:
            type: "string"
            enum:
              - "all"
              - "nonconfig"
              - "config"
        - name: "filter"
          schema:
            type: "string"
          in: "query"
        - name: "depth"
          schema:
            type: "integer"
          in: "query"
        - name: "offset"
          schema:
            type: "integer"
          in: "query"
        - name: "size"
          schema:
            type: "integer"
          in: "query"
        - name: "sortorder"
          schema:
            type: "string"
          in: "query"
        - name: "fields"
          schema:
            type: "string"
          in: "query"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ietf-network_networks_network_node_TOP"
            application/xml:
              schema:
                $ref: "#/components/schemas/ietf-network_networks_network_node"
          description: "OK"
      description: "The inventory of nodes of this network."
      summary: "GET - ietf-network - node"
    put:
      deprecated: false
      tags:
        - "controller ietf-network"
      parameters:
        - name: "network-id"
          description: "Identifies a network."
          schema:
            type: "string"
          in: "path"
          required: true
        - name: "node-id"
          description: "Uniquely identifies a node within the containing\nnetwork."
          schema:
            type: "string"
          in: "path"
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network_node_TOP"
          application/xml:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network_node"
          application/yang-data+json:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network_node_TOP"
          application/yang-data+xml:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network_node"
        description: "node_config"
      responses:
        "201":
          description: "Created"
        "204":
          description: "Updated"
      description: "The inventory of nodes of this network."
      summary: "PUT - ietf-network - node"
    delete:
      deprecated: false
      tags:
        - "controller ietf-network"
      parameters:
        - name: "network-id"
          description: "Identifies a network."
          schema:
            type: "string"
          in: "path"
          required: true
        - name: "node-id"
          description: "Uniquely identifies a node within the containing\nnetwork."
          schema:
            type: "string"
          in: "path"
          required: true
      responses:
        "204":
          description: "Deleted"
      description: "The inventory of nodes of this network."
      summary: "DELETE - ietf-network - node"
    patch:
      deprecated: false
      tags:
        - "controller ietf-network"
      parameters:
        - name: "network-id"
          description: "Identifies a network."
          schema:
            type: "string"
          in: "path"
          required: true
        - name: "node-id"
          description: "Uniquely identifies a node within the containing\nnetwork."
          schema:
            type: "string"
          in: "path"
          required: true
      requestBody:
        content:
          application/yang-data+json:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network_node_TOP"
          application/yang-data+xml:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network_node"
          application/json:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network_node_TOP"
          application/xml:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network_node"
        description: "node_config"
      responses:
        "200":
          description: "OK"
        "204":
          description: "Updated"
      description: "The inventory of nodes of this network."
      summary: "PATCH - ietf-network - node"
  /rests/data/ietf-network:networks/network={network-id}:
    get:
      deprecated: false
      tags:
        - "controller ietf-network"
      parameters:
        - name: "network-id"
          description: "Identifies a network."
          schema:
            type: "string"
          in: "path"
          required: true
        - required: false
          in: "query"
          name: "content"
          schema:
            type: "string"
            enum:
              - "all"
              - "nonconfig"
              - "config"
        - name: "filter"
          schema:
            type: "string"
          in: "query"
        - name: "depth"
          schema:
            type: "integer"
          in: "query"
        - name: "offset"
          schema:
            type: "integer"
          in: "query"
        - name: "size"
          schema:
            type: "integer"
          in: "query"
        - name: "sortorder"
          schema:
            type: "string"
          in: "query"
        - name: "fields"
          schema:
            type: "string"
          in: "query"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ietf-network_networks_network_TOP"
            application/xml:
              schema:
                $ref: "#/components/schemas/ietf-network_networks_network"
          description: "OK"
      description: "Describes a network.\nA network typically contains an inventory\
        \ of nodes,\ntopological information (augmented through the\nnetwork-topology\
        \ data model), and layering information."
      summary: "GET - ietf-network - network"
    put:
      deprecated: false
      tags:
        - "controller ietf-network"
      parameters:
        - name: "network-id"
          description: "Identifies a network."
          schema:
            type: "string"
          in: "path"
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network_TOP"
          application/xml:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network"
          application/yang-data+json:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network_TOP"
          application/yang-data+xml:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network"
        description: "network_config"
      responses:
        "201":
          description: "Created"
        "204":
          description: "Updated"
      description: "Describes a network.\nA network typically contains an inventory\
        \ of nodes,\ntopological information (augmented through the\nnetwork-topology\
        \ data model), and layering information."
      summary: "PUT - ietf-network - network"
    delete:
      deprecated: false
      tags:
        - "controller ietf-network"
      parameters:
        - name: "network-id"
          description: "Identifies a network."
          schema:
            type: "string"
          in: "path"
          required: true
      responses:
        "204":
          description: "Deleted"
      description: "Describes a network.\nA network typically contains an inventory\
        \ of nodes,\ntopological information (augmented through the\nnetwork-topology\
        \ data model), and layering information."
      summary: "DELETE - ietf-network - network"
    patch:
      deprecated: false
      tags:
        - "controller ietf-network"
      parameters:
        - name: "network-id"
          description: "Identifies a network."
          schema:
            type: "string"
          in: "path"
          required: true
      requestBody:
        content:
          application/yang-data+json:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network_TOP"
          application/yang-data+xml:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network"
          application/json:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network_TOP"
          application/xml:
            schema:
              $ref: "#/components/schemas/ietf-network_networks_network"
        description: "network_config"
      responses:
        "200":
          description: "OK"
        "204":
          description: "Updated"
      description: "Describes a network.\nA network typically contains an inventory\
        \ of nodes,\ntopological information (augmented through the\nnetwork-topology\
        \ data model), and layering information."
      summary: "PATCH - ietf-network - network"

components:
  schemas:
    ietf-network_networks_network_node_geolocation:
      x-yang-type: "container"
      properties:
        altitude:
          description: "Distance above sea level."
          format: "int64"
          x-yang-type: "int64"
          example: -9223372036854775808
          type: "string"
          xml:
            name: "altitude"
            namespace: "urn:ietf:params:xml:ns:yang:unm-network-topology"
        latitude:
          description: "Relative position north or south on the Earth's surface."
          example: -90.0
          x-yang-type: "decimal"
          type: "string"
          xml:
            name: "latitude"
            namespace: "urn:ietf:params:xml:ns:yang:unm-network-topology"
        longitude:
          description: "Angular distance east or west on the Earth's surface."
          example: -180.0
          x-yang-type: "decimal"
          type: "string"
          xml:
            name: "longitude"
            namespace: "urn:ietf:params:xml:ns:yang:unm-network-topology"
      xml:
        name: "geolocation"
        namespace: "urn:ietf:params:xml:ns:yang:unm-network-topology"
      description: "Contains a GPS location."
      title: "ietf-network_networks_network_node_geolocation"
      type: "object"
    ietf-network_networks_network_link_source:
      x-yang-type: "container"
      properties:
        source-node:
          description: "Source node identifier.  Must be in the same topology."
          example: "Some source-node"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "source-node"
            namespace: "urn:ietf:params:xml:ns:yang:ietf-network-topology"
        source-tp:
          description: "This termination point is located within the source node\n\
            and terminates the link."
          example: "Some source-tp"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "source-tp"
            namespace: "urn:ietf:params:xml:ns:yang:ietf-network-topology"
        unm-network-topology:source-site:
          description: "Source site identifier."
          example: "Some source-site"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "source-site"
            namespace: "urn:ietf:params:xml:ns:yang:unm-network-topology"
      xml:
        name: "source"
        namespace: "urn:ietf:params:xml:ns:yang:ietf-network-topology"
      description: "This container holds the logical source of a particular\nlink."
      title: "ietf-network_networks_network_link_source"
      type: "object"
    ietf-network_networks_network_supporting-network:
      x-yang-type: "container"
      properties:
        network-ref:
          description: "References the underlay network."
          example: "Some network-ref"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "network-ref"
            namespace: "urn:ietf:params:xml:ns:yang:ietf-network"
      xml:
        name: "supporting-network"
        namespace: "urn:ietf:params:xml:ns:yang:ietf-network"
      description: "An underlay network, used to represent layered network\ntopologies."
      title: "ietf-network_networks_network_supporting-network"
      type: "object"
    ietf-network_networks_network_node_termination-point:
      x-yang-type: "container"
      properties:
        tp-id:
          description: "Termination point identifier."
          example: "Some tp-id"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "tp-id"
            namespace: "urn:ietf:params:xml:ns:yang:ietf-network-topology"
        supporting-termination-point:
          type: "array"
          items:
            $ref: "#/components/schemas/ietf-network_networks_network_node_termination-point_supporting-termination-point"
          description: "This list identifies any termination points on which a\ngiven\
            \ termination point depends or onto which it maps.\nThose termination\
            \ points will themselves be contained\nin a supporting node.  This dependency\
            \ information can be\ninferred from the dependencies between links.  Therefore,\n\
            this item is not separately configurable.  Hence, no\ncorresponding constraint\
            \ needs to be articulated.\nThe corresponding information is simply provided\
            \ by the\nimplementing system."
          x-yang-type: "list"
          x-yang-list-key: "network-ref node-ref tp-ref"
        unm-network-topology:uuid:
          description: "Autogenerated unique identifier over all items inside the\
            \ network"
          minLength: 0
          maxLength: 36
          example: "00000000-0000-0000-0000-000000000000"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "uuid"
            namespace: "urn:ietf:params:xml:ns:yang:unm-network-topology"
          x-autogenerate: true
      xml:
        name: "termination-point"
        namespace: "urn:ietf:params:xml:ns:yang:ietf-network-topology"
      description: "A termination point can terminate a link.\nDepending on the type\
        \ of topology, a termination point\ncould, for example, refer to a port or\
        \ an interface."
      title: "ietf-network_networks_network_node_termination-point"
      type: "object"
    ietf-network_networks_network_network-types:
      x-yang-type: "container"
      properties: {}
      xml:
        name: "network-types"
        namespace: "urn:ietf:params:xml:ns:yang:ietf-network"
      description: "Serves as an augmentation target.\nThe network type is indicated\
        \ through corresponding\npresence containers augmented into this container."
      title: "ietf-network_networks_network_network-types"
      type: "object"
    ietf-network_networks_network_node_supporting-node:
      x-yang-type: "container"
      properties:
        network-ref:
          description: "References the underlay network of which the\nunderlay node\
            \ is a part."
          example: "Some network-ref"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "network-ref"
            namespace: "urn:ietf:params:xml:ns:yang:ietf-network"
        node-ref:
          description: "References the underlay node itself."
          example: "Some node-ref"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "node-ref"
            namespace: "urn:ietf:params:xml:ns:yang:ietf-network"
      xml:
        name: "supporting-node"
        namespace: "urn:ietf:params:xml:ns:yang:ietf-network"
      description: "Represents another node that is in an underlay network\nand that\
        \ supports this node.  Used to represent layering\nstructure."
      title: "ietf-network_networks_network_node_supporting-node"
      type: "object"
    ietf-network_networks_network_TOP:
      properties:
        ietf-network:network:
          type: "array"
          items:
            $ref: "#/components/schemas/ietf-network_networks_network"
          description: "Describes a network.\nA network typically contains an inventory\
            \ of nodes,\ntopological information (augmented through the\nnetwork-topology\
            \ data model), and layering information."
          x-yang-type: "list"
          x-yang-list-key: "network-id"
      title: "ietf-network_networks_network_TOP"
      type: "object"
    ietf-network_networks_network:
      x-yang-type: "container"
      properties:
        network-id:
          description: "Identifies a network."
          example: "Some network-id"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "network-id"
            namespace: "urn:ietf:params:xml:ns:yang:ietf-network"
        network-types:
          $ref: "#/components/schemas/ietf-network_networks_network_network-types"
          x-yang-type: "container"
        supporting-network:
          type: "array"
          items:
            $ref: "#/components/schemas/ietf-network_networks_network_supporting-network"
          description: "An underlay network, used to represent layered network\ntopologies."
          x-yang-type: "list"
          x-yang-list-key: "network-ref"
        node:
          type: "array"
          items:
            $ref: "#/components/schemas/ietf-network_networks_network_node"
          description: "The inventory of nodes of this network."
          x-yang-type: "list"
          x-yang-list-key: "node-id"
        unm-network-topology:controller:
          type: "array"
          items:
            $ref: "#/components/schemas/ietf-network_networks_network_controller"
          description: "list of configured southbound controllers"
          x-yang-type: "list"
          x-yang-list-key: "uuid"
        unm-network-topology-site:site:
          type: "array"
          items:
            $ref: "#/components/schemas/ietf-network_networks_network_site"
          description: "The sites inside a topology."
          x-yang-type: "list"
          x-yang-list-key: "site-id"
        ietf-network-topology:link:
          type: "array"
          items:
            $ref: "#/components/schemas/ietf-network_networks_network_link"
          description: "A network link connects a local (source) node and\na remote\
            \ (destination) node via a set of the respective\nnode's termination points.\
            \  It is possible to have several\nlinks between the same source and destination\
            \ nodes.\nLikewise, a link could potentially be re-homed between\ntermination\
            \ points.  Therefore, in order to ensure that we\nwould always know to\
            \ distinguish between links, every link\nis identified by a dedicated\
            \ link identifier.  Note that a\nlink models a point-to-point link, not\
            \ a multipoint link."
          x-yang-type: "list"
          x-yang-list-key: "link-id"
      xml:
        name: "network"
        namespace: "urn:ietf:params:xml:ns:yang:ietf-network"
      description: "Describes a network.\nA network typically contains an inventory\
        \ of nodes,\ntopological information (augmented through the\nnetwork-topology\
        \ data model), and layering information."
      title: "ietf-network_networks_network"
      type: "object"
    ietf-network_networks_network_link_supporting-link:
      x-yang-type: "container"
      properties:
        network-ref:
          description: "This leaf identifies in which underlay topology\nthe supporting\
            \ link is present."
          example: "Some network-ref"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "network-ref"
            namespace: "urn:ietf:params:xml:ns:yang:ietf-network-topology"
        link-ref:
          description: "This leaf identifies a link that is a part\nof this link's\
            \ underlay.  Reference loops in which\na link identifies itself as its\
            \ underlay, either\ndirectly or transitively, are not allowed."
          example: "Some link-ref"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "link-ref"
            namespace: "urn:ietf:params:xml:ns:yang:ietf-network-topology"
      xml:
        name: "supporting-link"
        namespace: "urn:ietf:params:xml:ns:yang:ietf-network-topology"
      description: "Identifies the link or links on which this link depends."
      title: "ietf-network_networks_network_link_supporting-link"
      type: "object"
    ietf-network_networks_network_link:
      x-yang-type: "container"
      properties:
        link-id:
          description: "The identifier of a link in the topology.\nA link is specific\
            \ to a topology to which it belongs."
          example: "Some link-id"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "link-id"
            namespace: "urn:ietf:params:xml:ns:yang:ietf-network-topology"
        source:
          $ref: "#/components/schemas/ietf-network_networks_network_link_source"
          x-yang-type: "container"
        destination:
          $ref: "#/components/schemas/ietf-network_networks_network_link_destination"
          x-yang-type: "container"
        supporting-link:
          type: "array"
          items:
            $ref: "#/components/schemas/ietf-network_networks_network_link_supporting-link"
          description: "Identifies the link or links on which this link depends."
          x-yang-type: "list"
          x-yang-list-key: "network-ref link-ref"
        unm-network-topology:uuid:
          description: "Autogenerated unique identifier over all items inside the\
            \ network"
          minLength: 0
          maxLength: 36
          example: "00000000-0000-0000-0000-000000000000"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "uuid"
            namespace: "urn:ietf:params:xml:ns:yang:unm-network-topology"
          x-autogenerate: true
      xml:
        name: "link"
        namespace: "urn:ietf:params:xml:ns:yang:ietf-network-topology"
      description: "A network link connects a local (source) node and\na remote (destination)\
        \ node via a set of the respective\nnode's termination points.  It is possible\
        \ to have several\nlinks between the same source and destination nodes.\n\
        Likewise, a link could potentially be re-homed between\ntermination points.\
        \  Therefore, in order to ensure that we\nwould always know to distinguish\
        \ between links, every link\nis identified by a dedicated link identifier.\
        \  Note that a\nlink models a point-to-point link, not a multipoint link."
      title: "ietf-network_networks_network_link"
      type: "object"
    ietf-network_networks_network_controller_bearer:
      x-yang-type: "container"
      x-yang-choice-key: "auth"
      properties:
        token:
          description: "bearer token to access controller instance"
          minLength: 1
          maxLength: 1024
          example: "Some token"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "token"
            namespace: "urn:ietf:params:xml:ns:yang:unm-network-topology"
      xml:
        name: "bearer"
        namespace: "urn:ietf:params:xml:ns:yang:unm-network-topology"
      description: ""
      title: "ietf-network_networks_network_controller_bearer"
      type: "object"
    ietf-network_networks_network_node:
      x-yang-type: "container"
      properties:
        node-id:
          description: "Uniquely identifies a node within the containing\nnetwork."
          example: "Some node-id"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "node-id"
            namespace: "urn:ietf:params:xml:ns:yang:ietf-network"
        supporting-node:
          type: "array"
          items:
            $ref: "#/components/schemas/ietf-network_networks_network_node_supporting-node"
          description: "Represents another node that is in an underlay network\nand\
            \ that supports this node.  Used to represent layering\nstructure."
          x-yang-type: "list"
          x-yang-list-key: "network-ref node-ref"
        unm-network-topology:uuid:
          description: "Autogenerated unique identifier over all items inside the\
            \ network"
          minLength: 0
          maxLength: 36
          example: "00000000-0000-0000-0000-000000000000"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "uuid"
            namespace: "urn:ietf:params:xml:ns:yang:unm-network-topology"
          x-autogenerate: true
        unm-network-topology:connection-state:
          description: "Describes the connection state of the device with SDNC"
          enum:
            - "Mounted"
            - "Unmounted"
            - "Connecting"
            - "Connected"
            - "UnableToConnect"
            - "Disconnected"
            - "Removed"
            - "Undefined"
          example: "Mounted"
          x-yang-type: "enum"
          type: "string"
          xml:
            name: "connection-state"
            namespace: "urn:ietf:params:xml:ns:yang:unm-network-topology"
        unm-network-topology:device-function:
          description: "Functions supported by the device that can be derived by using\
            \ the data-provider API"
          example: "Some device-function"
          x-yang-type: "string"
          type: "string"
          xml:
            name: "device-function"
            namespace: "urn:ietf:params:xml:ns:yang:unm-network-topology"
        unm-network-topology:host:
          description: "IP Address of the Node as assigned upon mounting on SDNC"
          minLength: 0
          maxLength: 255
          example: ""
